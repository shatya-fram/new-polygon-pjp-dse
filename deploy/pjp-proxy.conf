# /etc/nginx/snippets/pjp-proxy.conf — included by every allowlisted
# location in the pjp-dse site, so the proxy settings are stated once.
proxy_pass         http://pjp_dse;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Force fit against 7,761 desa is a legitimate half-minute of work and the
# gunicorn timeout allows 180s. nginx defaults to 60s, so without this a
# long border build would 504 at the proxy while the worker was still
# happily computing — a failure that looks like the app's and is not.
proxy_connect_timeout  10s;
proxy_send_timeout    190s;
proxy_read_timeout    190s;

# ══════════════════════════════════════════════════════════════════════════
# NEW POLYGON PJP DSE — nginx, as a tenant on a box with eight neighbours
#
#   sudo cp deploy/nginx.conf   /etc/nginx/sites-available/pjp-dse
#   sudo cp deploy/pjp-proxy.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/pjp-dse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # RELOAD. Never restart.
#
# WHAT THE SURVEY SETTLED, AND WHY THIS BLOCK IS SHAPED THIS WAY
#
# 1. THE BARE IP IS ALREADY SPOKEN FOR — TWICE.
#    consignment.conf carries `default_server`, and frontliner.conf lists
#    `188.245.228.253` as an explicit server_name. An exact name beats a
#    default_server in nginx, so http://188.245.228.253/ reaches FRONTLINER
#    today. This block therefore names itself and nothing else: no
#    default_server, no `_`, and the IP appears nowhere in it. Claiming
#    either would take another application's traffic silently.
#
# 2. THE NAMES ALREADY IN USE are dashboard, frontliner, kecamatan-analytics,
#    merchandiser, ops, postpaid and vanguard5g on gamextopia.id, plus
#    ops.188-245-228-253.sslip.io. `pjp` is free and fits the convention.
#
# 3. NO NEW FIREWALL RULE. ufw already allows 80 and 443. Serving under a
#    hostname on the ports nginx already owns means nothing to open, which
#    is one fewer change to a box carrying live services.
# ══════════════════════════════════════════════════════════════════════════

upstream pjp_dse {
    # gunicorn on 8096 — free on this box: 8001, 8080, 8081, 8082, 8090,
    # 8091, 8095 and 8099 are taken by the applications already here, and
    # 8180/8181 by nginx itself.
    server 127.0.0.1:8096 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name pjp.gamextopia.id;

    # certbot writes its challenge here and must reach it WITHOUT the
    # password. A basic-auth prompt in front of the ACME path is the usual
    # reason a renewal starts failing three months later, quietly.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pjp.gamextopia.id;

    ssl_certificate     /etc/letsencrypt/live/pjp.gamextopia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pjp.gamextopia.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "NEW POLYGON PJP DSE";
    auth_basic_user_file /etc/nginx/.htpasswd-pjp;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Nothing is uploaded to this instance. The workbook is read in the
    # browser; the only body that ever arrives is a polygon this server
    # drew. A megabyte is generous for that and refuses everything else at
    # the edge, before gunicorn spends a worker on it.
    client_max_body_size 1m;

    access_log /var/log/nginx/pjp-dse.access.log;
    error_log  /var/log/nginx/pjp-dse.error.log;

    # ── THE ALLOWLIST, REPEATED AT THE EDGE ──────────────────────────────
    # app.py already refuses everything outside config.WORKSPACE_READS. This
    # says the same thing again in nginx so that what is not served never
    # reaches gunicorn at all — two independent statements of one rule,
    # which is the point of writing it twice.

    location = /healthz {
        auth_basic off;                       # monitoring, not a person
        include snippets/pjp-proxy.conf;
    }

    location = /map-workspace   { include snippets/pjp-proxy.conf; }

    # Served from disk. nginx is better at it than gunicorn and it keeps two
    # workers free for the polygons.
    location /static/ {
        alias /opt/pjp-dse/static/;
        expires 1h;
        access_log off;
    }

    # The four boundary layers, by name. A prefix match on /api/territory/
    # would also admit poi.geojson and service-points.geojson — which is how
    # an allowlist quietly becomes a denylist.
    location ~ ^/api/territory/(kelurahan|kecamatan|indosat_mc|kabkot)\.geojson$ {
        include snippets/pjp-proxy.conf;
    }
    location = /api/territory/hierarchy   { include snippets/pjp-proxy.conf; }
    location = /api/samples/area-stats    { include snippets/pjp-proxy.conf; }
    location = /api/samples/desa-profile  { include snippets/pjp-proxy.conf; }
    location = /api/samples/area-profile  { include snippets/pjp-proxy.conf; }
    location = /api/samples/model.geojson { include snippets/pjp-proxy.conf; }

    # 404, not 403: a refusal confirms the path exists. This says nothing.
    location / { return 404; }
}

# nginx site — /etc/nginx/sites-available/pjp-dse
#
#   sudo ln -s /etc/nginx/sites-available/pjp-dse /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# The GeoJSON this application serves is coordinate text and compresses
# about five to one. It is already gzipped in the cache and sent with
# Content-Encoding, so nginx must NOT try to compress it again -- hence the
# explicit types rather than a blanket gzip on.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json;

upstream pjp_dse {
    server 127.0.0.1:5002 fail_timeout=0;
}

# ── rate limits ──────────────────────────────────────────────────────────
# Building a territory is seconds of CPU. Without a limit one person holding
# the reach slider, or one script, can occupy every worker and the site is
# down for everybody else.
limit_req_zone $binary_remote_addr zone=pjp_model:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pjp_general:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── the one door ─────────────────────────────────────────────────────
    # A single shared password for the whole site. NOTE: over plain HTTP
    # this password crosses the network in clear text on every request.
    # It keeps the data off search engines and away from a casual passer-by;
    # it does not protect against anyone who can watch the traffic. Put a
    # certificate on this before it carries anything that matters -- see the
    # TLS section in DEPLOY.md, it is about ten minutes.
    auth_basic "NEW POLYGON PJP DSE";
    auth_basic_user_file /etc/nginx/.htpasswd-pjp;

    client_max_body_size 8m;      # nothing is uploaded here; this is a floor
    limit_req zone=pjp_general burst=60 nodelay;

    # Health check, unauthenticated so a monitor can reach it. It reports
    # only whether the database is present -- no counts, no paths worth
    # having.
    location = /healthz {
        auth_basic off;
        access_log off;
        proxy_pass http://pjp_dse;
    }

    # The territory model is the expensive endpoint and the only write the
    # public instance accepts. Its own, much tighter limit.
    location = /api/samples/model.geojson {
        limit_req zone=pjp_model burst=3 nodelay;
        proxy_pass http://pjp_dse;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;   # Force fit is legitimately slow
    }

    # Static files are served by nginx, not by Python. The application's own
    # assets change when it is deployed, so they are cached briefly rather
    # than forever.
    location /static/ {
        alias /srv/pjp-dse/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://pjp_dse;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        # Layer responses are pre-gzipped by the application. Passing them
        # through untouched is the point of gzip_types above.
        proxy_set_header Accept-Encoding "gzip";
    }
}

# ── when you have a certificate ───────────────────────────────────────────
# certbot rewrites this file for you. If you would rather do it by hand:
# put the block above on `listen 443 ssl;` with your cert paths, and leave a
# port 80 server that does nothing but
#     return 301 https://$host$request_uri;
